<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
<a-scene keyboard-shortcuts="" screenshot="" xr-mode-ui="" device-orientation-permission-ui="">
    <a-gltf-model id="object" src="./GLTF/Asset 1.gltf" scale="20 20 20" gltf-model="./GLTF/Asset 1.gltf" position="0 2.80259 0"></a-gltf-model>
    <a-plane material="color: #029400" scale="50 50 50" rotation="90 0 0"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-assets>
          <img id="sky" src="./de8008a087dedf88e340f10b804b609e850fb2c7_2_690x345.jpeg">
  </a-assets>
  <a-sky src="#sky"></a-sky>

  <a-entity camera look-controls>
  <a-entity cursor="fuse: true; fuseTimeout: 500"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
            material="color: black; shader: flat">
  </a-entity>
</a-entity>

<a-entity id="box" cursor-listener geometry="primitive: box" material="color: blue"></a-entity>

    </a-scene>

    <script>
    // Component to change to a sequential color on click.
AFRAME.registerComponent('cursor-listener', {
  init: function () {
    var lastIndex = -1;
    var COLORS = ['red', 'green', 'blue'];
    this.el.addEventListener('click', function (evt) {
      lastIndex = (lastIndex + 1) % COLORS.length;
      this.setAttribute('material', 'color', COLORS[lastIndex]);
      console.log('I was clicked at: ', evt.detail.intersection.point);

      if(this.getAttribute("id") == "object") {
        alert("AHHHH OH GOD HELPPPP IT HURTS STOP CLICKING ME FUCK OFF I HATE YOU DIEEEE AHHHH IT HURTS")
        this.setAttribute("animation", "dur: 100; property: position; to: 3 0 4")
      }
    });
  }
});
</script>
  </body>
</html>
