    <article id="inspiration" class="inspo">
        <h1>inspiration</h1>
        <!-- <img src="./media/COLOUR.jpg" alt=""> -->
         <figure>
            <h3>The Matrix (1999)</h3>
            <iframe src="https://www.youtube.com/embed/H-0RHqDWcJE?si=huO3hoc9ww-5pFNJ&amp;clip=UgkxbqH34NUlV6JrYFwcL7O1mwVbuhXoxDm2&amp;clipt=EO7QCRj29wk" title="YouTube video player" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <p>upon rewatching the matrix, i was surprised at how well the special effects had aged, and how terrible the sequels look in comparison. i think scenes like this, where the entire environment are recreated for the animation are really impressive. you see this (to a lesser effect) in matrix revelations when neo is blinded, it's maybe the only special effects shot from the sequels that i like :/</p>
        </figure>
        <figure>
            <h3>Persona 3 Reload (2024)</h3>
            <iframe src="https://www.youtube.com/embed/fXgKcM20M08?si=GxFoIR__CQ0dDgl6&t=10" title="YouTube video player" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <p>ever since persona 5, the ui design has been extremely flashy and detailed while still maintaining functionality and readability. it's impressive how over detailed every menu can be while still not being more complicated than an average jrpg.</p>
        </figure>
        <figure>
            <h3>Xbox Dashboard (2001)</h3>
            <iframe src="https://www.youtube.com/embed/nm6XchTak40?si=_MHzeX6-6r3ovsTN" title="YouTube video player" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <p>the xbox dashboard is just such a facinating thing to go through, it's truly an experience. I love all the different panels and menus that make up this dashboard, but i think the thing i love the most about it is the sounds, the little beeps and the sound of moving between options really bring this menu to life.</p>
        </figure>
        <figure>
            <h3>Tubes Screensaver (2001)</h3>
            <iframe src="https://1j01.github.io/pipes/"></iframe>
            <p>i just really like older animations and cgi, the most impressive part of tubes for me specifically is how it's completely randomized and generated in real time. i'd want to learn how to make similar generated graphics</p>
        </figure>
        <figure>
            <h3>War&Peace AOKI takamasa Remix fan animation (?)</h3>
            <iframe src="https://www.youtube.com/embed/bgdCLOfG360?si=v9yflna5KdSdx1cn" title="YouTube video player" frameborder="0" allow="web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <p>sadly i couldn't find the original artist as this animation has been stolen and reposted by everyone and their mother, but it's a good example of the type of work i aspire to make with motion graphics.</p>
        </figure>
        <figure>
            <h3>PAPERS (1991)</h3>
            <iframe src="https://www.youtube.com/embed/56EG957YinM?si=X1c3HJLnWTg8hEVF" title="YouTube video player" frameborder="0" allow="web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <p>i can't imagine the amount of time and dedication it took to line up all of these newspapers in order to create this, especially at the time it was made.</p>
        </figure>
        <figure>
            <h3>meow mix (2024)</h3>
            <iframe src="https://www.youtube.com/embed/GiaD7WSdb4M?si=_bfL3Cx0fBmifzXh" title="YouTube video player" frameborder="0" allow="web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <p>this video is a motion graphics nightmare. i can only imagine that editing even one second of this video took days, especially with the mix of different animation styles.</p>
        </figure>
        <figure>
            <h3>༄ GRAVITY BASINS ࿐ by 2swap (2024)</h3>
            <iframe src="https://www.youtube.com/embed/LavXSS5Xtbg?si=-y6V-p5fU0j0u6We" title="YouTube video player" frameborder="0" allow="web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <p>a lot of weird and specific educational videos that i watch use facinating visuals and graphics in order to not only demonstrate their point but keep the viewer's attention. i could honestly fill this entire inspo list with just weirdly specific and strange educational videos</p>
        </figure>
        <figure>
            <h3>FREE COUCH by snailwar (2025)</h3>
            <iframe src="https://www.youtube.com/embed/7zbNBCb_AOU?si=-X_sWJxg6ho4RegE" title="YouTube video player" frameborder="0" allow="web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
            <p>another weird 3d animation that employs a lot of different animation techniques and styles in order to create a captivating watch. my favorite thing about this video is how it's able to blend 3d models with live action green screened elements in a convinsing and interesting way.</p>
        </figure>
        <figure>
            <h3>TODAY'S MISSION by FREAKBA¡T (2021 - ongoing)</h3>
            <iframe src="https://www.youtube.com/embed/IZXpyt8lvoE" title="YouTube video player" frameborder="0" allow="web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <p>FREAKBA¡T's unique yet simple designs for all of his characters make for a very interesting and recognizable series of animations. it's videos like these that inspire me want to get better at 3d animation.</p>
        </figure>
        <figure>
            <h3>first post! by oliver lescot</h3>
            <blockquote class="twitter-tweet" data-theme="dark" data-dnt="true" align="center"><p lang="en" dir="ltr">Hello, new on twitter, I make some animations, first post! <a href="https://t.co/HgbDzJj7PR">pic.twitter.com/HgbDzJj7PR</a></p>&mdash; olivier lescot (@OlivierLes25100) <a href="https://twitter.com/OlivierLes25100/status/1796793428883210435?ref_src=twsrc%5Etfw">June 1, 2024</a></blockquote>
            <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
            <p>this video was everywhere when it was first posted on twitter, and for good reason. I aspire to make monochromatic animations like these and it's this exact style that i'm trying to learn to recreate in blender for my own animations.</p>
        </figure>
        <figure>
            <h3>underscores concert</h3>
            <iframe src="https://www.youtube.com/embed/-u8ld7XTeqU?si=46TGdINUXSy_FbL9&t=2503s" title="YouTube video player" frameborder="0" allow="web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <p>in some of underscores' concerts she uses animations and videos in the background to add emphasis to her songs, the most facinating thing about these animations is that they (to my knowledge) have never been officially released anywhere by her.</p>
        </figure>
        <figure>
            <h3>Music by underscores music video (2025)</h3>
            <iframe src="https://www.youtube.com/embed/UNYqwpx7Cys?si=-9a-PtEwYPf72fbs&amp;clip=UgkxTARppjKDIRmHoJ7uaplAIg_C4Q8Y_jfy&amp;clipt=ELaMAxiZkgY" title="YouTube video player" frameborder="0" allow="web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <p>another underscores mention because this is MY list and I CAN DO WHAT I WANT. <br> this is less so motion graphics and more video editing but this is an example of the kind of things i want to learn to make in a effortless way. i have a concept for a music video that would use the same kind of cuts and editing.</p>
        </figure>
